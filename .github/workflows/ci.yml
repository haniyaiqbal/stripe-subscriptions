name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U billing"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://billing:billing@localhost:5433/billing
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      APP_URL: http://localhost:3000
      # Tests use a fake Stripe: these never reach Stripe.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Migrations match the entities
        run: npm run migration:run && npm run migration:check
      - run: npm run test:e2e
